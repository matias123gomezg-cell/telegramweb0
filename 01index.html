<title>Telegram</title>
<style>
:root{--blue:#229ed9;--blue2:#168ac4;--pale:#e8f5fc;--bg:#edf3f7;--panel:#fff;--text:#17212b;--muted:#71808e;--line:#e5ebef;--green:#39b980;--danger:#e35d6a;--shadow:0 8px 28px #1b354711}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #229ed955;outline-offset:2px}.app{height:100dvh;min-height:560px;display:grid;grid-template-columns:340px 1fr;max-width:1500px;margin:auto;background:var(--panel);box-shadow:var(--shadow);overflow:hidden}.sidebar{border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}.brand{height:72px;display:flex;align-items:center;gap:12px;padding:0 20px;border-bottom:1px solid var(--line)}.logo{width:42px;height:42px;border-radius:50%;background:var(--blue);display:grid;place-items:center;color:white;flex-shrink:0}.logo svg{width:25px;height:25px}.brand h1{font-size:21px;margin:0;font-weight:750;letter-spacing:-.5px}.brand small{display:block;color:var(--muted);font-size:11px;font-weight:500}.top-actions{margin-left:auto;display:flex;gap:5px}.iconbtn{background:transparent;color:var(--muted);border-radius:10px;width:38px;height:38px;display:grid;place-items:center;font-size:19px}.iconbtn:hover{background:var(--pale);color:var(--blue)}.search-wrap{padding:13px 15px 8px}.search{background:#f1f5f8;border-radius:12px;display:flex;align-items:center;padding:0 12px;gap:8px}.search input{border:0;background:transparent;outline:0;width:100%;padding:11px 0;color:var(--text)}.tabs{display:flex;padding:0 15px;gap:5px}.tab{background:transparent;color:var(--muted);padding:9px 11px;border-radius:9px;font-weight:650;font-size:13px}.tab.active{background:var(--pale);color:var(--blue)}.chat-list{overflow:auto;flex:1;padding:6px 8px}.chat-item{display:flex;gap:12px;align-items:center;padding:11px 10px;border-radius:13px;cursor:pointer}.chat-item:hover{background:#f5f9fb}.chat-item.active{background:var(--pale)}.avatar{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#70c7ed,#229ed9);display:grid;place-items:center;color:#fff;font-weight:750;font-size:17px;overflow:hidden;flex-shrink:0}.avatar img{width:100%;height:100%;object-fit:cover}.chat-info{min-width:0;flex:1}.chat-row{display:flex;justify-content:space-between;gap:5px;align-items:center}.chat-name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chat-time,.chat-preview{font-size:12px;color:var(--muted)}.chat-preview{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}.unread{font-size:11px;color:white;background:var(--blue);border-radius:20px;min-width:19px;padding:2px 5px;text-align:center}.sidebar-foot{border-top:1px solid var(--line);padding:11px 14px;display:flex;gap:9px;align-items:center}.my-info{min-width:0;flex:1}.my-info b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.my-info span{font-size:11px;color:var(--muted)}.main{min-width:0;display:flex;flex-direction:column;background:#f6f9fb;position:relative}.welcome{margin:auto;text-align:center;max-width:360px;padding:30px}.welcome .logo{width:86px;height:86px;margin:0 auto 20px}.welcome h2{margin:0 0 8px}.welcome p{color:var(--muted);font-size:14px}.primary{background:var(--blue);color:white;border-radius:10px;padding:10px 15px;font-weight:700}.primary:hover{background:var(--blue2)}.secondary{background:var(--pale);color:var(--blue);border-radius:10px;padding:10px 14px;font-weight:700}.danger{background:#fff0f1;color:var(--danger);border-radius:10px;padding:9px 12px;font-weight:650}.chat-head{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 18px}.chat-head-info{flex:1;min-width:0}.chat-head-info b{display:block}.chat-head-info span{font-size:12px;color:var(--muted)}.messages{flex:1;overflow:auto;padding:24px clamp(14px,4vw,55px);display:flex;flex-direction:column;gap:10px;background-color:#f3f8fb;background-image:radial-gradient(#d7eaf4 0.7px,transparent .7px);background-size:18px 18px}.day-label{align-self:center;background:#dfeef6;color:#607887;padding:4px 12px;border-radius:12px;font-size:11px;margin-bottom:5px}.bubble{max-width:min(75%,540px);padding:9px 12px 6px;background:white;border-radius:14px 14px 14px 4px;box-shadow:0 1px 2px #1231;overflow-wrap:anywhere;white-space:pre-wrap;position:relative}.bubble.mine{align-self:flex-end;background:#d9f4ff;border-radius:14px 14px 4px 14px}.bubble img{display:block;max-width:100%;max-height:260px;border-radius:9px;margin-bottom:5px}.bubble .stamp{display:flex;justify-content:flex-end;gap:5px;color:#738794;font-size:10px;margin-top:3px}.bubble .stamp button{background:transparent;color:#71808e;font-size:11px;padding:0 2px}.composer{background:#fff;border-top:1px solid var(--line);padding:12px 16px;display:flex;align-items:flex-end;gap:9px}.compose-box{flex:1;background:#f1f5f8;border-radius:15px;display:flex;align-items:flex-end;padding:5px 9px;gap:6px;min-width:0}.compose-box textarea{resize:none;max-height:120px;min-height:39px;flex:1;border:0;background:transparent;outline:0;padding:9px 4px;color:var(--text)}.send{height:42px;width:42px;border-radius:50%;background:var(--blue);color:white;font-size:19px}.panel{position:absolute;inset:0;background:#f6f9fb;z-index:3;display:flex;flex-direction:column}.panel-head{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 20px;gap:12px}.panel-head h2{font-size:18px;margin:0;flex:1}.panel-body{padding:24px;overflow:auto}.card{background:white;border:1px solid var(--line);border-radius:15px;padding:18px;margin-bottom:14px}.card h3{margin:0 0 10px;font-size:16px}.muted{color:var(--muted);font-size:13px}.field{display:flex;flex-direction:column;gap:6px;margin:11px 0}.field label{font-weight:650;font-size:13px}.field input,.field textarea,.field select{border:1px solid #dce5eb;border-radius:10px;padding:11px 12px;width:100%;background:white;color:var(--text)}.field small{color:var(--muted)}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.row .spacer{flex:1}.pill{display:inline-block;background:#e9f5fb;color:#188fc6;padding:4px 8px;border-radius:20px;font-size:11px;font-weight:750}.user-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}.user-row:last-child{border-bottom:0}.user-row .details{flex:1;min-width:0}.user-row b{display:block}.user-row small{color:var(--muted)}.state-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin:8px 0}.notice{padding:12px 14px;border-radius:10px;background:#fff8e7;color:#806126;font-size:13px;margin-bottom:12px}.success{color:#17865a}.empty{text-align:center;color:var(--muted);padding:30px 12px}.mobile-back{display:none}.modal-backdrop{position:fixed;inset:0;background:#10233177;z-index:20;display:grid;place-items:center;padding:16px}.modal{background:white;border-radius:18px;width:min(500px,100%);max-height:90dvh;overflow:auto;padding:22px;box-shadow:0 20px 60px #0017}.modal h2{margin:0 0 6px}.modal-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}.hidden{display:none!important}.config-code{font:12px/1.5 ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere;background:#f3f6f8;padding:12px;border-radius:10px;max-height:300px;overflow:auto}.photo-btn{position:relative;overflow:hidden}.photo-btn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
@media(max-width:720px){.app{display:block;height:100dvh;min-height:0}.sidebar{height:100%;border:0}.main{display:none;height:100%;position:absolute;inset:0}.app.in-chat .sidebar{display:none}.app.in-chat .main{display:flex}.mobile-back{display:grid}.brand{height:64px}.chat-head{height:64px;padding:0 10px}.messages{padding:16px 12px}.bubble{max-width:88%}.panel-body{padding:16px}.form-grid{grid-template-columns:1fr}.sidebar-foot{padding-bottom:max(11px,env(safe-area-inset-bottom))}.composer{padding-bottom:max(12px,env(safe-area-inset-bottom))}}

/* Rediseño moderno: colores vivos, profundidad y mejor adaptación móvil */
:root{--blue:#6558f5;--blue2:#5145dc;--pale:#eeecff;--bg:#f2f3ff;--panel:#fff;--text:#191b35;--muted:#777b98;--line:#e7e7f3;--green:#20b985;--danger:#e84c72;--shadow:0 18px 55px #34306b18}
body{background:radial-gradient(ellipse at 12% 0%,#e7e5ff 0,transparent 34%),radial-gradient(ellipse at 100% 90%,#dff9f3 0,transparent 32%),#f5f6ff;color:var(--text)}
.app{max-width:1540px;margin:18px auto;height:calc(100dvh - 36px);min-height:540px;border:1px solid #ffffff;border-radius:24px;box-shadow:0 24px 80px #29245d1c}
.sidebar{background:linear-gradient(180deg,#fff 0%,#fbfbff 100%)}
.brand{height:82px;border-bottom:1px solid #eeedfb}.logo{background:linear-gradient(135deg,#887bff,#5b4be8);box-shadow:0 8px 20px #6558f533}.brand h1{letter-spacing:-.8px}.brand small{letter-spacing:.2px}
.search{background:#f2f2ff;border:1px solid transparent;transition:.2s}.search:focus-within{border-color:#bcb5ff;background:#fff;box-shadow:0 0 0 4px #6558f511}
.tab{transition:.2s}.tab.active{background:linear-gradient(135deg,#eeecff,#e4e1ff);color:#5c4de5}
.chat-item{transition:background .18s,transform .18s}.chat-item:hover{background:#f1f0ff;transform:translateX(2px)}.chat-item.active{background:linear-gradient(110deg,#eeecff,#f6f5ff)}
.avatar{background:linear-gradient(135deg,#8f83ff,#5b4be8);box-shadow:0 4px 12px #6558f51c}.main{background:linear-gradient(145deg,#fbfbff,#f2f5ff)}
.welcome .logo{background:linear-gradient(135deg,#8c80ff,#5145dc);box-shadow:0 18px 38px #6558f533}.welcome h2{letter-spacing:-.7px}.primary,.send{background:linear-gradient(135deg,#796cff,#5145dc);box-shadow:0 6px 16px #6558f52a;transition:transform .15s,filter .15s}.primary:hover,.send:hover{background:linear-gradient(135deg,#6e60fa,#4539ce);filter:saturate(1.1);transform:translateY(-1px)}
.secondary{background:#efedff;color:#5a4ce0}.secondary:hover{background:#e4e0ff}.danger{background:#fff0f4;color:#d93d65}.danger:hover{background:#ffe1e9}
.chat-head,.panel-head{background:#ffffffed;backdrop-filter:blur(14px)}.messages{background-color:#f4f5ff;background-image:radial-gradient(#d7d7f5 .7px,transparent .7px)}.day-label{background:#e7e5ff;color:#6155c8}.bubble{border:1px solid #ebeaf5;box-shadow:0 4px 14px #2c28600a}.bubble.mine{background:linear-gradient(135deg,#e9e7ff,#e4f7ff);border-color:#dedbff}
.composer{background:#ffffffed;backdrop-filter:blur(12px)}.compose-box{background:#f3f3ff}.compose-box:focus-within{box-shadow:0 0 0 3px #6558f511}.panel{background:#f7f7ff}.panel-head{border-bottom-color:#e9e8f7}.card,.state-card{border-color:#e9e8f7;border-radius:18px;box-shadow:0 8px 24px #39356c08}.field input,.field textarea,.field select{border-color:#e1e1f1;border-radius:12px}.field input:focus,.field textarea:focus,.field select:focus{border-color:#a8a0ff;outline:3px solid #6558f514}.modal{border:1px solid #f0efff;border-radius:22px;box-shadow:0 28px 90px #1c194333}.pill{background:#efedff;color:#5b4de2}
@media(max-width:760px){.app{height:100dvh;min-height:0;margin:0;border-radius:0;border:0;grid-template-columns:1fr}.sidebar{border-right:0}.main{display:none}.app.in-chat .sidebar{display:none}.app.in-chat .main{display:flex}.brand{height:72px}.panel-body{padding:16px}.form-grid{grid-template-columns:1fr}.bubble{max-width:88%}}
</style>

<body>
<div class="app" id="app">
<aside class="sidebar" id="sidebar">
 <div class="brand"><div class="logo" aria-label="Telegram"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.8 3.2 18.5 20c-.25 1.2-.9 1.5-1.85.95l-5.1-3.75-2.45 2.35c-.27.27-.5.5-1.02.5l.36-5.2 9.45-8.54c.41-.36-.09-.56-.64-.2L5.57 13.27.53 11.7c-1.1-.34-1.12-1.1.23-1.63L20.45 2.5c.91-.33 1.7.22 1.35.7Z"/></svg></div><div><h1>Telegram</h1><small>Mensajería simple y rápida</small></div><div class="top-actions"><button class="iconbtn" id="newChatBtn" title="Nueva conversación">✎</button><button class="iconbtn" id="menuBtn" title="Menú">☰</button></div></div>
 <div class="search-wrap"><div class="search"><span>⌕</span><input id="searchInput" placeholder="Buscar usuario, número de cuenta o chat" autocomplete="off"></div></div>
 <div class="tabs"><button class="tab active" data-filter="all">Todos</button><button class="tab" data-filter="unread">No leídos</button><button class="tab" data-filter="groups">Grupos</button></div>
 <div class="chat-list" id="chatList"></div>
 <div class="sidebar-foot"><div class="avatar" id="myAvatar">?</div><div class="my-info"><b id="myName">Invitado</b><span id="myNumber">Modo de demostración</span></div><button class="iconbtn" id="profileBtn" title="Mi perfil">⚙</button></div>
</aside>
<main class="main" id="main">
 <div class="welcome" id="welcome"><div class="logo"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.8 3.2 18.5 20c-.25 1.2-.9 1.5-1.85.95l-5.1-3.75-2.45 2.35c-.27.27-.5.5-1.02.5l.36-5.2 9.45-8.54c.41-.36-.09-.56-.64-.2L5.57 13.27.53 11.7c-1.1-.34-1.12-1.1.23-1.63L20.45 2.5c.91-.33 1.7.22 1.35.7Z"/></svg></div><h2>Bienvenido a Telegram</h2><p>Envía mensajes, comparte imágenes, crea grupos y mantente en contacto.</p><button class="primary" id="startBtn">Nueva conversación</button></div>
 <div class="chat-head hidden" id="chatHead"><button class="iconbtn mobile-back" id="backBtn" aria-label="Volver">‹</button><div class="avatar" id="headAvatar">?</div><div class="chat-head-info"><b id="headName">Chat</b><span id="headStatus">en línea</span></div><button class="iconbtn" id="headMore" title="Opciones">⋮</button></div>
 <div class="messages hidden" id="messages"></div>
 <div class="composer hidden" id="composer"><label class="iconbtn photo-btn" title="Adjuntar imagen">＋<input id="imageInput" type="file" accept="image/*"></label><div class="compose-box"><textarea id="messageInput" rows="1" placeholder="Escribe un mensaje..."></textarea></div><button class="send" id="sendBtn" title="Enviar">➤</button></div>
 <section class="panel hidden" id="panel"><div class="panel-head"><button class="iconbtn" id="panelBack">‹</button><h2 id="panelTitle">Panel</h2><button class="iconbtn" id="panelClose">✕</button></div><div class="panel-body" id="panelBody"></div></section>
</main></div>
<div class="modal-backdrop hidden" id="modalBackdrop"><div class="modal" id="modal"></div></div>
<script>
/* Telegram single-file app. Demo data is local to this browser; a shared backend must be configured separately. */
const $=id=>document.getElementById(id);const now=()=>new Date().toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'});const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const makeId=()=>Math.random().toString(36).slice(2,10);const banned=['ooc','rol','roleplay'];
let currentUser=localStorage.getItem('tg_current_user')||null,activeChat=null,filter='all',panelMode=null,backend=null,backendUser=null,backendEnabled=false,typingTimer=null,readTimer=null;
function readStore(key,fallback=[]){try{const value=JSON.parse(localStorage.getItem(key)||'null');return Array.isArray(value)?value:fallback}catch(err){console.warn('Datos locales dañados en '+key+'; se inicia vacío.',err);return fallback}}
let users=readStore('tg_users_v1');
let chats=readStore('tg_chats_v1');
let messages=readStore('tg_msgs_v1');
let states=readStore('tg_states_v1');let contactIds=readStore('tg_contacts_v1');
// Elimina los usuarios y conversaciones ficticios de versiones anteriores.
// Migración segura: elimina únicamente cuentas y chats de demostración antiguos; conserva la cuenta real del usuario.
const demoIds=new Set(['u_sofia','u_diego','u_luna']);
const removedDemoChats=new Set(chats.filter(c=>['c_sofia','c_equipo'].includes(c.id)).map(c=>c.id));
users=users.filter(u=>!demoIds.has(u.id));
chats=chats.filter(c=>!removedDemoChats.has(c.id)&&!c.members.some(id=>demoIds.has(id)));
messages=messages.filter(m=>!removedDemoChats.has(m.chatId)&&!demoIds.has(m.sender));
states=states.filter(s=>!demoIds.has(s.userId));
contactIds=contactIds.filter(id=>!demoIds.has(id));
if(currentUser&&demoIds.has(currentUser)){currentUser=null;localStorage.removeItem('tg_current_user');}

function save(){try{localStorage.setItem('tg_users_v1',JSON.stringify(users));localStorage.setItem('tg_chats_v1',JSON.stringify(chats));localStorage.setItem('tg_msgs_v1',JSON.stringify(messages));localStorage.setItem('tg_states_v1',JSON.stringify(states));localStorage.setItem('tg_contacts_v1',JSON.stringify(contactIds));return true}catch(err){console.error('No se pudieron guardar los datos locales:',err);toast('No hay espacio suficiente en este navegador. Reduce el tamaño de las imágenes.');return false}}
function me(){return users.find(u=>u.id===currentUser)||null}function user(id){return users.find(u=>u.id===id)||{id,username:'Usuario',number:'',role:'Registrado'}}function initials(name){return (name||'?').trim().split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase()}function avatarHTML(u,size=''){return `<div class="avatar ${size}" ${u.photo?'':''}>${u.photo?`<img src="${u.photo}" alt="Foto de ${esc(u.username)}">`:esc(initials(u.username))}</div>`}function isAdmin(u=me()){return !!u&&u.role==='Dueño'}function canCreateGroup(u=me()){return !!u&&['Dueño','Administrador','Creador de grupo'].includes(u.role)}
function toast(msg){const n=document.createElement('div');n.textContent=msg;n.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:99;background:#17212b;color:white;padding:11px 17px;border-radius:12px;box-shadow:0 8px 24px #0003;max-width:90vw;text-align:center';document.body.append(n);setTimeout(()=>n.remove(),2800)}
function setUser(id){currentUser=id;localStorage.setItem('tg_current_user',id);activeChat=null;save();render();if(!backendEnabled)toast('Cuenta abierta en este navegador. Para compartir datos entre dispositivos falta conectar Supabase.')}function openModal(html){$('modal').innerHTML=html;$('modalBackdrop').classList.remove('hidden')}function closeModal(){$('modalBackdrop').classList.add('hidden');$('modal').innerHTML=''}$('modalBackdrop').addEventListener('click',e=>{if(e.target===$('modalBackdrop'))closeModal()});
function render(){let u=me();$('myName').textContent=u?u.username:'Invitado';$('myNumber').textContent=u?`N.º ${u.number} · ${u.role}`:'No has iniciado sesión';$('myAvatar').innerHTML=u?(u.photo?`<img src="${u.photo}" alt="">`:esc(initials(u.username))):'?';$('chatList').innerHTML='';let q=$('searchInput').value.trim().toLowerCase();let list=chats.filter(c=>u&&c.members.includes(u.id)).filter(c=>filter==='unread'?c.unread>0:filter==='groups'?c.group:true).filter(c=>(c.name+' '+(c.members||[]).map(id=>user(id).username+' '+user(id).number+' '+user(id).discord).join(' ')).toLowerCase().includes(q));list.sort((a,b)=>(b.id===activeChat)-(a.id===activeChat));list.forEach(c=>{let other=c.group?null:user(c.members.find(id=>id!==u.id));let title=c.group?c.name:other?.username||c.name;let last=messages.filter(m=>m.chatId===c.id).slice(-1)[0];let prev=last?(last.image?'📷 Imagen':last.text):c.last||'Sin mensajes';let photo=other?.photo;let av=c.group?'👥':photo?`<img src="${photo}" alt="">`:esc(initials(title));let el=document.createElement('div');el.className='chat-item'+(c.id===activeChat?' active':'');el.innerHTML=`<div class="avatar">${av}</div><div class="chat-info"><div class="chat-row"><span class="chat-name">${esc(title)}</span><span class="chat-time">${esc(last?.time||c.time||'')}</span></div><div class="chat-row"><span class="chat-preview">${esc(prev)}</span>${c.unread?`<span class="unread">${c.unread}</span>`:''}</div></div>`;el.onclick=()=>openChat(c.id);$('chatList').append(el)});if(u&&q){let matches=users.filter(x=>x.id!==u.id&&(x.username+' '+x.number+' '+(x.discord||'')).toLowerCase().includes(q));let chatMemberIds=new Set(chats.filter(c=>!c.group&&c.members.includes(u.id)).flatMap(c=>c.members.filter(id=>id!==u.id)));matches.filter(x=>!chatMemberIds.has(x.id)).forEach(x=>{let el=document.createElement('div');el.className='chat-item';el.innerHTML=`${avatarHTML(x)}<div class="chat-info"><div class="chat-name">${esc(x.username)}</div><div class="chat-preview">N.º ${esc(x.number)} · ${esc(x.discord||'Sin Discord')}</div></div>${u.role==='Dueño'&&x.role!=='Dueño'?`<button class="danger" data-owner-delete="${x.id}" style="padding:7px 9px">Eliminar cuenta</button>`:'<span class="pill">Usuario</span>'}`;el.onclick=e=>{if(e.target.closest('[data-owner-delete]'))return;addContact(x.id);let c=chats.find(c=>!c.group&&c.members.includes(u.id)&&c.members.includes(x.id));if(c)openChat(c.id);else toast('No se pudo abrir la conversación. Intenta de nuevo.');};el.querySelector('[data-owner-delete]')?.addEventListener('click',e=>{e.stopPropagation();deleteUser(x.id)});$('chatList').append(el)})}if(!$('chatList').children.length)$('chatList').innerHTML='<div class="empty">No se encontraron chats ni usuarios. Busca por nombre o número.</div>';if(u&&activeChat)renderChat();else showWelcome();}
function showWelcome(){ $('welcome').classList.remove('hidden');$('chatHead').classList.add('hidden');$('messages').classList.add('hidden');$('composer').classList.add('hidden');$('panel').classList.add('hidden');$('app').classList.remove('in-chat')}
function openChat(id){if(!me()){showAuth();return}activeChat=id;let c=chats.find(x=>x.id===id);if(!c)return;c.unread=0;save();$('app').classList.add('in-chat');$('welcome').classList.add('hidden');$('panel').classList.add('hidden');$('chatHead').classList.remove('hidden');$('messages').classList.remove('hidden');$('composer').classList.remove('hidden');let other=user(c.members.find(x=>x!==currentUser));let title=c.group?c.name:other.username;$('headName').textContent=title;$('headAvatar').innerHTML=c.group?'👥':other.photo?`<img src="${other.photo}" alt="">`:esc(initials(title));$('headStatus').textContent=c.group?`${c.members.length} miembros`:'últ. vez recientemente';renderMessages();render();setTimeout(()=>$('messageInput').focus(),80)}
function renderChat(){if(!activeChat)return;let c=chats.find(x=>x.id===activeChat);if(!c)return;let other=user(c.members.find(x=>x!==currentUser));$('headName').textContent=c.group?c.name:other.username;$('headAvatar').innerHTML=c.group?'👥':other.photo?`<img src="${other.photo}" alt="">`:esc(initials(other.username));$('headStatus').textContent=c.group?`${c.members.length} miembros`:'en línea';renderMessages()}
function renderMessages(){let box=$('messages'),arr=messages.filter(m=>m.chatId===activeChat);box.innerHTML='<div class="day-label">HOY</div>';if(!arr.length)box.innerHTML+='<div class="empty">Inicia la conversación enviando un mensaje.</div>';arr.forEach(m=>{let mine=m.sender===currentUser,who=user(m.sender);let el=document.createElement('div');el.className='bubble'+(mine?' mine':'');el.innerHTML=`${!mine&&chats.find(c=>c.id===activeChat)?.group?`<div style="font-size:11px;color:var(--blue);font-weight:700;margin-bottom:3px">${esc(who.username)}</div>`:''}${m.image?`<img src="${m.image}" alt="Imagen compartida">`:''}${m.text?`<span>${esc(m.text)}</span>`:''}<div class="stamp"><span>${esc(m.time||'')}</span>${mine?`<span title="${m.seen?'Visto':'Enviado'}">${m.seen?'✓✓':'✓'}</span>`:''}${mine?`<button data-delete="${m.id}" title="Eliminar mensaje">Eliminar</button>`:''}</div>`;box.append(el)});box.scrollTop=box.scrollHeight;box.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>deleteMessage(b.dataset.delete));}
function containsBanned(text){let t=text.toLowerCase();return banned.some(w=>new RegExp('(^|[^a-záéíóúñ0-9])'+w+'([^a-záéíóúñ0-9]|$)','i').test(t))}function sendMessage(text,image=''){if(!me()){showAuth();return}if(!activeChat)return;if(!text.trim()&&!image)return;if(containsBanned(text)){toast('Mensaje bloqueado: contiene una palabra prohibida.');return}let m={id:makeId(),chatId:activeChat,sender:currentUser,text:text.trim(),image,time:now(),seen:false};messages.push(m);let c=chats.find(x=>x.id===activeChat);if(c){c.last=image?'📷 Imagen':text.trim();c.time=m.time}save();$('messageInput').value='';$('messageInput').style.height='auto';renderMessages();render();}
function deleteMessage(id){let m=messages.find(x=>x.id===id);if(!m)return;if(m.sender!==currentUser&&!isAdmin()){toast('Solo puedes eliminar tus propios mensajes.');return}if(confirm('¿Eliminar este mensaje?')){messages=messages.filter(x=>x.id!==id);save();renderMessages();render()}}
function openPanel(title,html,mode){panelMode=mode;$('panelTitle').textContent=title;$('panelBody').innerHTML=html;$('panel').classList.remove('hidden');$('welcome').classList.add('hidden');$('chatHead').classList.add('hidden');$('messages').classList.add('hidden');$('composer').classList.add('hidden');$('panelBody').querySelectorAll('[data-action]').forEach(el=>el.addEventListener('click',()=>handleAction(el.dataset.action,el.dataset.id)));}
function closePanel(){panelMode=null;$('panel').classList.add('hidden');if(activeChat)openChat(activeChat);else showWelcome()}
function handleAction(action,id){if(action==='make-admin')changeRole(id,'Administrador');if(action==='remove-admin')changeRole(id,'Registrado');if(action==='make-group-creator')changeRole(id,'Creador de grupo');if(action==='delete-user')deleteUser(id);if(action==='add-contact')addContact(id);if(action==='view-state')viewState(id);if(action==='open-chat'){let c=chats.find(c=>c.id===id);if(c){closePanel();openChat(id)}}}
function showAuth(){openModal(`<div class="row"><div class="logo">➤</div><div><h2>Crear cuenta</h2><div class="muted">Únete a Telegram en unos pasos.</div></div></div><form id="authForm"><div class="field"><label>Usuario de cuenta</label><input name="username" required maxlength="32" autocomplete="nickname" placeholder="Escribe tu usuario de cuenta"></div><div class="field"><label>Usuario de Discord</label><input name="discord" required maxlength="40" placeholder="Ej. rlpope_2"></div><div class="field"><label>Imagen de perfil</label><input name="photo" type="file" accept="image/*" required><small>Elige una imagen JPG, PNG o WebP (máximo 800 KB).</small></div><p class="muted">Se asignará un número único de seis dígitos. Tu cuenta queda guardada en este navegador y se abrirá automáticamente la próxima vez. Para compartirla entre dispositivos falta conectar Supabase.</p><div class="modal-foot"><button class="primary" type="submit">Crear cuenta</button></div></form>`);$('authForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),username=String(f.get('username')).trim(),discord=String(f.get('discord')||'').trim(),file=e.target.photo.files[0];if(!username||!discord||!file){toast('Completa los tres campos.');return}if(file.size>800000){toast('La imagen debe pesar menos de 800 KB.');return}if(!file.type.startsWith('image/')){toast('Selecciona un archivo de imagen válido.');return}const existingOwner=users.find(x=>x.role==='Dueño');if(username.toLowerCase()==='pablo escobar'&&discord.toLowerCase()==='rlpope_2'&&existingOwner){toast('La cuenta de Dueño ya existe. No es posible recuperar o elevar el rango solo con el nombre y Discord; usa la sesión ya iniciada en este navegador.');return}const duplicate=users.find(x=>x.username.toLowerCase()===username.toLowerCase()||x.discord.toLowerCase()===discord.toLowerCase());if(duplicate){if(duplicate.username.toLowerCase()===username.toLowerCase()&&duplicate.discord.toLowerCase()===discord.toLowerCase()){setUser(duplicate.id);closeModal();toast('Esta cuenta ya existe. Sesión iniciada. Número: '+duplicate.number);return}toast('Ese usuario de cuenta o Discord ya está registrado. Usa los dos datos de la misma cuenta.');return}let photo=await readFile(file),num;do{num=String(Math.floor(100000+Math.random()*900000))}while(users.some(x=>x.number===num));let ownerExists=users.some(x=>x.role==='Dueño');let isOwner=!ownerExists&&username.toLowerCase()==='pablo escobar'&&discord.toLowerCase()==='rlpope_2';let u={id:'u_'+makeId(),username,discord,number:num,role:isOwner?'Dueño':'Registrado',photo,created:true};users.push(u);contactIds=[];save();setUser(u.id);closeModal();toast((isOwner?'Cuenta de dueño creada. ':'Cuenta creada. ')+'Tu número es '+num)} }
function readFile(file){return new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}
function addContact(id){if(!me())return;if(id===currentUser){toast('Ese es tu usuario.');return}if(!contactIds.includes(id))contactIds.push(id);let existing=chats.find(c=>!c.group&&c.members.includes(currentUser)&&c.members.includes(id));if(!existing){let u=user(id);chats.push({id:'c_'+makeId(),name:u.username,members:[currentUser,id],group:false,createdBy:currentUser,last:'',time:'',unread:0})}save();render();toast('Contacto agregado');}
function newConversation(){if(!me()){showAuth();return}openModal(`<h2>Nueva conversación</h2><p class="muted">Busca por número de seis dígitos o nombre de usuario.</p><div class="field"><label>Buscar usuario</label><input id="contactSearch" placeholder="Número o usuario"></div><div id="contactResults"></div><div class="modal-foot"><button class="secondary" id="cancelNew">Cerrar</button></div>`);$('cancelNew').onclick=closeModal;$('contactSearch').oninput=()=>{let q=$('contactSearch').value.trim().toLowerCase();let results=users.filter(u=>u.id!==currentUser&&(u.username.toLowerCase().includes(q)||u.number.includes(q)||u.discord.toLowerCase().includes(q)));$('contactResults').innerHTML=results.map(u=>`<div class="user-row">${avatarHTML(u)}<div class="details"><b>${esc(u.username)}</b><small>N.º ${esc(u.number)} · ${esc(u.discord||'Discord no indicado')}</small></div><button class="secondary" data-pick="${u.id}">Abrir</button>${me()?.role==='Dueño'&&u.role!=='Dueño'?`<button class="danger" data-remove-account="${u.id}">Eliminar cuenta</button>`:''}</div>`).join('')||'<p class="muted">No se encontraron usuarios.</p>';document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{let id=b.dataset.pick;closeModal();addContact(id);let c=chats.find(c=>!c.group&&c.members.includes(currentUser)&&c.members.includes(id));if(c)openChat(c.id)});document.querySelectorAll('[data-remove-account]').forEach(b=>b.onclick=()=>deleteUser(b.dataset.removeAccount))};$('contactSearch').dispatchEvent(new Event('input'))}
function newGroup(){if(!me())return showAuth();if(!canCreateGroup()){toast('No tienes permiso para crear grupos.');return}openModal(`<h2>Crear grupo</h2><p class="muted">Elige un nombre y miembros entre tus contactos.</p><form id="groupForm"><div class="field"><label>Nombre del grupo</label><input name="name" required maxlength="50" placeholder="Ej. Amigos"></div><div class="field"><label>Miembros</label><div style="max-height:220px;overflow:auto">${users.filter(u=>u.id!==currentUser).map(u=>`<label style="display:flex;gap:9px;align-items:center;padding:7px 0"><input type="checkbox" name="members" value="${u.id}"> ${esc(u.username)} <span class="muted">· ${esc(u.number)}</span></label>`).join('')}</div></div><div class="modal-foot"><button type="button" class="secondary" id="cancelGroup">Cancelar</button><button class="primary">Crear grupo</button></div></form>`);$('cancelGroup').onclick=closeModal;$('groupForm').onsubmit=e=>{e.preventDefault();let fd=new FormData(e.target),members=[currentUser,...fd.getAll('members')];if(members.length<2){toast('Selecciona al menos otra persona.');return}let c={id:'g_'+makeId(),name:String(fd.get('name')).trim(),members:[...new Set(members)],group:true,createdBy:currentUser,last:'Grupo creado',time:now(),unread:0};chats.push(c);save();closeModal();render();openChat(c.id);toast('Grupo creado en esta demostración')};}
function profilePanel(){let u=me();if(!u){showAuth();return}openPanel('Mi perfil',`<div class="card"><div class="row">${avatarHTML(u)}<div><h3 style="margin:0">${esc(u.username)}</h3><div class="muted">N.º ${esc(u.number)} · ${esc(u.role)}</div></div></div><p class="muted">Nombre de Discord: ${esc(u.discord||'No indicado')}</p><button class="secondary" id="editProfile">Editar perfil</button> <button class="secondary" id="myStates">Mis estados</button></div><div class="card"><h3>Cuenta</h3><p class="muted">${backendEnabled?'Conectado a Supabase':'Modo demostración: los datos se guardan solo en este navegador.'}</p><button class="secondary" id="settingsBtn">Configuración de conexión</button> <button class="danger" id="logoutBtn">Cerrar sesión</button></div><div class="card"><h3>Privacidad</h3><p class="muted">En el modo real, los permisos deben aplicarse en la base de datos. Esta demostración local no debe usarse para conversaciones privadas.</p></div>`,'profile');$('editProfile').onclick=editProfile;$('myStates').onclick=()=>statesPanel(true);$('settingsBtn').onclick=settingsPanel;$('logoutBtn').onclick=()=>{currentUser=null;localStorage.removeItem('tg_current_user');activeChat=null;closePanel();render();showAuth()}}
function editProfile(){let u=me();openModal(`<h2>Editar perfil</h2><form id="editForm"><div class="field"><label>Usuario de cuenta</label><input name="username" required value="${esc(u.username)}" maxlength="24"></div><div class="field"><label>Nombre de Discord</label><input name="discord" value="${esc(u.discord)}" maxlength="40"></div><div class="field"><label>Cambiar foto</label><input name="photo" type="file" accept="image/*"></div><div class="modal-foot"><button type="button" class="secondary" id="editCancel">Cancelar</button><button class="primary">Guardar</button></div></form>`);$('editCancel').onclick=closeModal;$('editForm').onsubmit=async e=>{e.preventDefault();let fd=new FormData(e.target),name=String(fd.get('username')).trim();if(users.some(x=>x.id!==u.id&&x.username.toLowerCase()===name.toLowerCase()))return toast('Ese usuario ya existe.');u.username=name;u.discord=String(fd.get('discord')).trim();let file=e.target.photo.files[0];if(file){if(file.size>800000)return toast('La foto debe pesar menos de 800 KB en la demo.');u.photo=await readFile(file)}save();closeModal();profilePanel();render();toast('Perfil actualizado')}}
function statesPanel(own=false){let u=me();if(!u)return;let visible=states.filter(s=>own?s.userId===u.id:(contactIds.includes(s.userId)||s.userId===u.id));openPanel(own?'Mis estados':'Estados',`<div class="card"><h3>Publicar estado</h3><p class="muted">Solo tus contactos pueden ver tus estados.</p><form id="stateForm"><div class="field"><label>Texto del estado</label><textarea name="text" rows="3" maxlength="240" required placeholder="¿Qué quieres compartir?"></textarea></div><button class="primary">Publicar estado</button></form></div><h3>Estados recientes</h3>${visible.slice().reverse().map(s=>`<div class="state-card"><div class="row">${avatarHTML(user(s.userId))}<div><b>${esc(user(s.userId).username)}</b><div class="muted">${esc(s.time)}</div></div></div><p>${esc(s.text)}</p>${s.userId===u.id?`<button class="danger" data-delstate="${s.id}">Eliminar</button>`:''}</div>`).join('')||'<div class="empty">Todavía no hay estados.</div>'}`,'states');$('stateForm').onsubmit=e=>{e.preventDefault();let text=String(new FormData(e.target).get('text')).trim();if(containsBanned(text))return toast('Estado bloqueado: contiene una palabra prohibida.');states.push({id:makeId(),userId:currentUser,text,time:now()});save();statesPanel(own);toast('Estado publicado')};$('panelBody').querySelectorAll('[data-delstate]').forEach(b=>b.onclick=()=>{states=states.filter(s=>s.id!==b.dataset.delstate);save();statesPanel(own)})}
function deleteUser(id){if(!me()||me().role!=='Dueño'){toast('Solo el dueño de la plataforma puede eliminar cuentas.');return}const target=users.find(x=>x.id===id);if(!target){toast('No se encontró esa cuenta.');return}if(target.role==='Dueño'){toast('No se puede eliminar la cuenta del dueño.');return}if(!confirm(`¿Eliminar la cuenta de ${target.username} y sus datos locales?`))return;const removedChatIds=chats.filter(c=>c.members.includes(id)).map(c=>c.id);users=users.filter(u=>u.id!==id);contactIds=contactIds.filter(x=>x!==id);chats=chats.filter(c=>!c.members.includes(id));messages=messages.filter(m=>m.sender!==id&&!removedChatIds.includes(m.chatId));states=states.filter(s=>s.userId!==id);if(activeChat&&removedChatIds.includes(activeChat)){activeChat=null;showWelcome()}save();render();toast('Cuenta eliminada en este navegador')}
function settingsPanel(){openPanel('Conexión y despliegue',`<div class="notice">Para tener cuentas y mensajes reales, crea las tablas en Supabase y configura la conexión aquí. Nunca pegues la clave <b>service_role</b> en este archivo.</div><div class="card"><h3>Conectar Supabase</h3><div class="field"><label>URL del proyecto</label><input id="sbUrl" placeholder="https://xxxx.supabase.co" value="${esc(localStorage.getItem('tg_sb_url')||'')}"></div><div class="field"><label>Clave pública (anon / publishable)</label><input id="sbKey" placeholder="sb_publishable_... o clave anon" value="${esc(localStorage.getItem('tg_sb_key')||'')}"></div><button class="primary" id="connectBtn">Conectar</button> <button class="secondary" id="disconnectBtn">Desconectar</button><p class="muted">El cliente de Supabase se carga desde su CDN cuando se conecta; por eso hace falta internet al publicar. La conexión por sí sola no crea el esquema ni sustituye las políticas RLS.</p><div id="connectionStatus" class="muted">${backendEnabled?'Conectado':'No conectado'}</div></div><div class="card"><h3>Preparar base de datos</h3><p class="muted">Este SQL crea las tablas básicas y habilita RLS. Es un punto de partida; antes de producción hay que revisar las políticas, configurar autenticación y probar los permisos.</p><button class="secondary" id="showSql">Ver SQL de instalación</button><div id="sqlWrap" class="hidden"><pre class="config-code" id="sqlCode"></pre><button class="secondary" id="copySql">Copiar SQL</button></div></div><div class="card"><h3>Publicar desde el celular</h3><ol><li>Guarda este archivo como <b>index.html</b>.</li><li>Súbelo a un repositorio de GitHub.</li><li>En Vercel, importa el repositorio y despliega.</li><li>En Supabase, ejecuta el SQL de instalación y configura la autenticación.</li><li>Abre tu web y pega la URL y la clave pública en este panel.</li></ol></div>`,'settings');$('connectBtn').onclick=connectSupabase;$('disconnectBtn').onclick=()=>{backend=null;backendEnabled=false;backendUser=null;localStorage.removeItem('tg_sb_url');localStorage.removeItem('tg_sb_key');$('connectionStatus').textContent='Desconectado';toast('Se quitó la configuración local')};$('showSql').onclick=()=>{$('sqlWrap').classList.toggle('hidden');$('sqlCode').textContent=SQL};$('copySql').onclick=()=>navigator.clipboard?.writeText(SQL).then(()=>toast('SQL copiado')).catch(()=>toast('Selecciona y copia el SQL'))}
const SQL=`-- Telegram: esquema inicial (ejecutar en Supabase SQL Editor)
create extension if not exists pgcrypto;
create table if not exists public.profiles (
 id uuid primary key references auth.users(id) on delete cascade,
 username text unique not null check (char_length(username) between 2 and 24),
 discord_name text not null default '',
 number char(6) unique not null,
 photo_url text,
 role text not null default 'Registrado' check (role in ('Dueño','Administrador','Registrado','Creador de grupo')),
 created_at timestamptz not null default now()
);
create table if not exists public.contacts (
 user_id uuid not null references public.profiles(id) on delete cascade,
 contact_id uuid not null references public.profiles(id) on delete cascade,
 created_at timestamptz not null default now(), primary key(user_id,contact_id), check(user_id<>contact_id)
);
create table if not exists public.chats (
 id uuid primary key default gen_random_uuid(), name text not null default '', is_group boolean not null default false,
 created_by uuid not null references public.profiles(id), created_at timestamptz not null default now()
);
create table if not exists public.chat_members (
 chat_id uuid not null references public.chats(id) on delete cascade,
 user_id uuid not null references public.profiles(id) on delete cascade,
 joined_at timestamptz not null default now(), primary key(chat_id,user_id)
);
create table if not exists public.messages (
 id uuid primary key default gen_random_uuid(), chat_id uuid not null references public.chats(id) on delete cascade,
 sender_id uuid not null references public.profiles(id), body text not null default '', image_url text,
 created_at timestamptz not null default now(), seen_at timestamptz,
 check (char_length(body)<=5000), check (body !~* '(^|[^[:alnum:]_])(ooc|rol|roleplay)([^[:alnum:]_]|$)')
);
create table if not exists public.states (
 id uuid primary key default gen_random_uuid(), user_id uuid not null references public.profiles(id) on delete cascade,
 body text not null check (char_length(body)<=240), created_at timestamptz not null default now(), expires_at timestamptz not null default now()+interval '24 hours'
);
alter table public.profiles enable row level security;
alter table public.contacts enable row level security;
alter table public.chats enable row level security;
alter table public.chat_members enable row level security;
alter table public.messages enable row level security;
alter table public.states enable row level security;
-- Políticas iniciales: perfiles autenticados visibles para búsqueda; cada usuario solo modifica su perfil sin cambiar su rol.
create policy "profiles read authenticated" on public.profiles for select to authenticated using (true);
create policy "profile insert self" on public.profiles for insert to authenticated with check (id=auth.uid() and role='Registrado');
create policy "profile update self" on public.profiles for update to authenticated using (id=auth.uid()) with check (id=auth.uid());
create policy "contacts read participants" on public.contacts for select to authenticated using (user_id=auth.uid() or contact_id=auth.uid());
create policy "contacts add self" on public.contacts for insert to authenticated with check (user_id=auth.uid());
create policy "contacts delete self" on public.contacts for delete to authenticated using (user_id=auth.uid());
create policy "chat member read" on public.chat_members for select to authenticated using (user_id=auth.uid() or exists(select 1 from public.chat_members cm where cm.chat_id=chat_members.chat_id and cm.user_id=auth.uid()));
create policy "chat create authenticated" on public.chats for insert to authenticated with check (created_by=auth.uid());
create policy "chat read members" on public.chats for select to authenticated using (exists(select 1 from public.chat_members cm where cm.chat_id=chats.id and cm.user_id=auth.uid()));
create policy "member add by creator" on public.chat_members for insert to authenticated with check (exists(select 1 from public.chats c where c.id=chat_id and c.created_by=auth.uid()));
create policy "messages read members" on public.messages for select to authenticated using (exists(select 1 from public.chat_members cm where cm.chat_id=messages.chat_id and cm.user_id=auth.uid()));
create policy "messages send as member" on public.messages for insert to authenticated with check (sender_id=auth.uid() and exists(select 1 from public.chat_members cm where cm.chat_id=messages.chat_id and cm.user_id=auth.uid()));
create policy "messages delete own" on public.messages for delete to authenticated using (sender_id=auth.uid());
create policy "states read contacts" on public.states for select to authenticated using (user_id=auth.uid() or exists(select 1 from public.contacts c where c.user_id=auth.uid() and c.contact_id=states.user_id));
create policy "states insert self" on public.states for insert to authenticated with check (user_id=auth.uid());
create policy "states delete own" on public.states for delete to authenticated using (user_id=auth.uid());

async function connectSupabase(){let url=$('sbUrl').value.trim().replace(/\/$/,'');let key=$('sbKey').value.trim();if(!/^https:\/\/[\w.-]+\.supabase\.co$/.test(url)||!key){toast('Revisa la URL y la clave pública.');return}try{if(!window.supabase){await new Promise((resolve,reject)=>{let s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';s.onload=resolve;s.onerror=reject;document.head.appendChild(s)})}backend=window.supabase.createClient(url,key);let {error}=await backend.from('profiles').select('id').limit(1);if(error&&error.code!=='PGRST116'){if(error.code==='42P01'||error.code==='PGRST205')throw new Error('Conexión válida, pero faltan tablas. Ejecuta el SQL incluido.');if(error.code==='42501')throw new Error('Conexión establecida, pero las políticas no permiten esta consulta. Revisa RLS.');throw error}localStorage.setItem('tg_sb_url',url);localStorage.setItem('tg_sb_key',key);backendEnabled=true;$('connectionStatus').textContent='Conexión comprobada. Aún debes configurar autenticación y esquema.';toast('Conexión con Supabase comprobada');}catch(e){$('connectionStatus').textContent='No se pudo verificar: '+(e.message||e);toast('Error de conexión: '+(e.message||e))}}

$('searchInput').oninput=render;$('startBtn').onclick=newConversation;$('newChatBtn').onclick=newConversation;$('menuBtn').onclick=()=>openModal(`<h2>Menú</h2><div class="row" style="margin-top:18px"><button class="secondary" id="menuContacts">Buscar usuarios</button><button class="secondary" id="menuStates">Estados</button><button class="secondary" id="menuGroup">Crear grupo</button><button class="secondary" id="menuSettings">Configuración</button></div><div class="modal-foot"><button class="secondary" id="menuClose">Cerrar</button></div>`),$('profileBtn').onclick=profilePanel;$('backBtn').onclick=()=>{$('app').classList.remove('in-chat');activeChat=null;showWelcome();render()};$('headMore').onclick=()=>openModal(`<h2>Opciones de conversación</h2><div class="row" style="margin-top:18px"><button class="secondary" id="chatContact">Ver perfil / contacto</button><button class="secondary" id="chatStates">Estados</button><button class="danger" id="chatDelete">Eliminar conversación</button></div><div class="modal-foot"><button class="secondary" id="chatClose">Cerrar</button></div>`);$('panelBack').onclick=closePanel;$('panelClose').onclick=closePanel;
